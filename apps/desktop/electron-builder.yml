# electron-builder 配置（P5 打包）
#
# 产物：NSIS 安装包（release/ 目录），仅打包 out/ 三端产物与生产依赖，
# content/ 与博客仓库的任何代码都不进入安装包 —— CMS 只读写外部工作区。

appId: com.xuwenshi.mycms
productName: my-blog CMS
copyright: Copyright © 2026 xuwenshi

directories:
  output: release
  buildResources: build

# 本机直连 github.com 不通：直接复用 npm 已装好的 electron dist，免去 electron-builder 再去下载
electronDist: node_modules/electron/dist

# 只收编 electron-vite 的三端产物；其余（源码、测试、node_modules 里的开发依赖）不进包
files:
  - out/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: my-blog CMS